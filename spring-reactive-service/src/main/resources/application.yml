server:
  port: 8081

application:
  response:
    delay:
      ms: 10

spring:
  r2dbc:
    url: r2dbc:h2:mem:///testdbReactive?options=DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    pool:
      enabled: true
      initial-size: 2
      max-size: 5

  datasource:
    url: jdbc:h2:mem:testdbReactive;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
    user: sa
    password:

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.springframework.jdbc: DEBUG
    liquibase: DEBUG
    reactor.netty: DEBUG
    org.springframework.web.reactive: DEBUG